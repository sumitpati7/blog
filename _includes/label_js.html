<script>
  var trelloColors = {
    "green_light": { background: "#d0f0c0", color: "#225522" }, // lighter minty green, dark text
    "green":       { background: "#4caf50", color: "#ffffff" }, // material green 500
    "green_dark":  { background: "#2e7d32", color: "#ffffff" },

    "yellow_light": { background: "#fff9c4", color: "#665500" }, // pale yellow, dark text
    "yellow":       { background: "#fbc02d", color: "#000000" }, // material yellow 700
    "yellow_dark":  { background: "#b28704", color: "#ffffff" },

    "orange_light": { background: "#ffe0b2", color: "#804000" }, // light orange, darker text
    "orange":       { background: "#fb8c00", color: "#000000" }, // material orange 600
    "orange_dark":  { background: "#c25e00", color: "#ffffff" },

    "red_light": { background: "#ffcdd2", color: "#7a0000" }, // light red
    "red":       { background: "#e53935", color: "#ffffff" }, // material red 600
    "red_dark":  { background: "#ab000d", color: "#ffffff" },

    "purple_light": { background: "#e1bee7", color: "#4a148c" }, // light purple
    "purple":       { background: "#8e24aa", color: "#ffffff" }, // material purple 600
    "purple_dark":  { background: "#5c007a", color: "#ffffff" },

    "blue_light": { background: "#bbdefb", color: "#0d47a1" }, // light blue
    "blue":       { background: "#1e88e5", color: "#ffffff" }, // material blue 600
    "blue_dark":  { background: "#0d47a1", color: "#ffffff" },

    "sky_light": { background: "#b2ebf2", color: "#006064" }, // light cyan-ish
    "sky":       { background: "#00acc1", color: "#ffffff" },
    "sky_dark":  { background: "#007c91", color: "#ffffff" },

    "lime_light": { background: "#f0f4c3", color: "#616200" }, // light lime
    "lime":       { background: "#d4e157", color: "#000000" },
    "lime_dark":  { background: "#afb42b", color: "#ffffff" },

    "pink_light": { background: "#f8bbd0", color: "#880e4f" },
    "pink":       { background: "#d81b60", color: "#ffffff" },
    "pink_dark":  { background: "#a00037", color: "#ffffff" },

    "black_light": { background: "#cfd8dc", color: "#222222" },
    "black":       { background: "#455a64", color: "#ffffff" },
    "black_dark":  { background: "#263238", color: "#ffffff" }
  };


  document.querySelectorAll('.label-item').forEach(el => {
    const colorName = el.dataset.color?.toLowerCase() || '';
    const colors = trelloColors[colorName] || { background: '#999999', color: '#ffffff' };

    el.style.backgroundColor = colors.background;
    el.style.color = colors.color;
  });
</script>
